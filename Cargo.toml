[workspace]
resolver = "3"
members = ["crates/common", "crates/protocol", "crates/procfs", "crates/capture", "crates/analyzer", "crates/symbolizer", "crates/sensor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/polsala/LeakScope"
homepage = "https://github.com/polsala/LeakScope"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
prost = "=0.14.3"
tokio = { version = "=1.49.0", features = ["full"] }
zstd = "=0.13.3"
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

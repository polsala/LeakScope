name: Session lifecycle soak
on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [metrics, native]
        default: metrics
permissions:
  contents: read
jobs:
  soak:
    if: github.event_name == 'schedule' || inputs.profile == 'metrics'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: bash scripts/build-python27.sh ucs4 release
      - run: cargo build --workspace --locked
      - name: One-hour genuine Python 2 metrics, bounded cache and collector/sensor restarts
        run: .venv/bin/python tests/soak/observation.py --duration 3600 --restart-interval 300 --output artifacts/soak/observation.json
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - name: Authenticated isolated lifecycle soak
        run: .venv/bin/python tests/soak/run.py --duration 300 --output artifacts/soak/lifecycle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soak-evidence
          path: |
            /tmp/leakscope-soak*
            artifacts/soak/**
  native-authorization:
    if: github.ref == 'refs/heads/main' && inputs.profile == 'native'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check-trusted-environment.py kernel-validation
        env:
          GH_TOKEN: ${{ github.token }}
  native-soak:
    needs: native-authorization
    if: github.ref == 'refs/heads/main' && inputs.profile == 'native'
    runs-on: [self-hosted, linux, x64, leakscope-kernel]
    environment: kernel-validation
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: bash scripts/build-python27.sh ucs4 release
      - run: cargo build --workspace --locked
      - name: Explicit operator-managed tracing privileges
        run: |
          if [ "${{ vars.LEAKSCOPE_ALLOW_SETCAP }}" = 1 ]; then
            sudo setcap cap_bpf,cap_perfmon,cap_sys_ptrace+ep target/debug/leakscope-sensor
          fi
      - name: Two-hour real native windows and restart qualification
        run: .venv/bin/python tests/soak/native.py --duration 7200 --window-seconds 15 --restart-every 20 --output artifacts/soak/native-two-hours.json
        env:
          LEAKSCOPE_KERNEL_TEST: '1'
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-soak-evidence
          path: artifacts/soak/**

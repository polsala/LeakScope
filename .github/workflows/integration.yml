name: Sensor collector integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: bash scripts/build-python27.sh ucs4 release
      - run: bash scripts/build-python27.sh ucs4 lab
      - run: bash scripts/test-legacy.sh
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - run: make test-integration
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - name: Actual ENOSPC and durable-prefix recovery on isolated hosted runner
        shell: bash
        run: |
          mkdir -p /tmp/leakscope-full
          sudo mount -t tmpfs -o size=1M,uid=$(id -u),gid=$(id -g),mode=0700 tmpfs /tmp/leakscope-full
          trap 'sudo umount /tmp/leakscope-full' EXIT
          LEAKSCOPE_ENOSPC_PATH=/tmp/leakscope-full .venv/bin/pytest -q tests/reliability/test_storage.py
          sudo umount /tmp/leakscope-full
          sudo mount -t tmpfs -o size=4M,uid=$(id -u),gid=$(id -g),mode=0700 tmpfs /tmp/leakscope-full
          LEAKSCOPE_SQLITE_ENOSPC_PATH=/tmp/leakscope-full .venv/bin/pytest -q tests/reliability/test_database.py

name: Build versioned distribution
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Verify tag matches source version
        run: test "${GITHUB_REF_NAME}" = "v$(.venv/bin/python -c 'import leakscope_api;print(leakscope_api.__version__)')"
      - run: make test lint typecheck
      - run: bash packaging/release/package.sh
      - run: .venv/bin/python scripts/sbom.py
      - name: Verify offline installer in a fresh prefix
        run: |
          PYTHON=python bash artifacts/leakscope-0.1.0-linux-x86_64/install.sh /tmp/leakscope-install
          /tmp/leakscope-install/bin/leakscope --version
          /tmp/leakscope-install/bin/leakscope doctor --json
      - name: Build modern-runtime OCI image
        run: docker build -f packaging/docker/Dockerfile -t leakscope:${GITHUB_REF_NAME} .
      - name: Optional detached signatures
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          if [ -z "$RELEASE_GPG_KEY" ]; then
            echo 'No signing key configured; no detached signature will be claimed.'
            exit 0
          fi
          printf '%s' "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --armor --detach-sign artifacts/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*.deb artifacts/SHA256SUMS* artifacts/sbom.cdx.json dist/*.whl dist/*.tar.gz --generate-notes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/SHA256SUMS*
            artifacts/sbom.cdx.json

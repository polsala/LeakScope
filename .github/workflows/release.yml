name: Build versioned distribution
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  kernel-release-gate:
    env:
      LEAKSCOPE_SENSOR_CAPABILITIES: ${{ vars.LEAKSCOPE_SENSOR_CAPABILITIES }}
    runs-on: [self-hosted, linux, x64, leakscope-kernel]
    environment: kernel-validation
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: bash scripts/build-python27.sh ucs4 release
      - run: bash scripts/test-kernel.sh
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - run: corepack pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: bash scripts/test-kernel-browser.sh
        env:
          LEAKSCOPE_SENSOR_BIN: ${{ github.workspace }}/target/release/leakscope-sensor
          LEAKSCOPE_ANALYZER_BIN: ${{ github.workspace }}/target/release/leakscope-analyzer
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - name: Verify genuine Python allocation attribution and cleanup
        run: |
          bash scripts/test-legacy.sh
          bash scripts/build-python27.sh ucs4 lab
          .venv/bin/pytest -q tests/integration/test_python_attribution.py
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-kernel-evidence
          path: artifacts/kernel
  distribution:
    needs: kernel-release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - name: Verify tag matches source version
        run: test "${GITHUB_REF_NAME}" = "v$(.venv/bin/python -c 'import leakscope_api;print(leakscope_api.__version__)')"
      - run: make test lint typecheck
      - run: bash packaging/release/package.sh
      - run: .venv/bin/python scripts/sbom.py
      - name: Verify offline installer in a fresh prefix
        run: |
          PYTHON=python bash artifacts/leakscope-0.1.0-linux-x86_64/install.sh /tmp/leakscope-install
          /tmp/leakscope-install/bin/leakscope --version
          /tmp/leakscope-install/bin/leakscope doctor --json
      - run: bash scripts/test-installed-ubuntu.sh
      - name: Build modern-runtime OCI image
        run: docker build -f packaging/docker/Dockerfile -t leakscope:${GITHUB_REF_NAME} .
      - name: Attest distribution artifacts in the trusted release environment
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb
      - name: Optional detached signatures
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          if [ -z "$RELEASE_GPG_KEY" ]; then
            echo 'No signing key configured; no detached signature will be claimed.'
            exit 0
          fi
          printf '%s' "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --armor --detach-sign artifacts/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Engineering preview until all independent production gates qualify.
          # Portable/kernel success alone is insufficient for production labeling.
          gh release create "${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*.deb artifacts/SHA256SUMS* artifacts/sbom.cdx.json dist/*.whl dist/*.tar.gz --generate-notes --prerelease
      - name: Publish fail-closed machine-readable readiness
        run: .venv/bin/python scripts/release-gates.py > artifacts/release-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/SHA256SUMS*
            artifacts/sbom.cdx.json
            artifacts/release-readiness.json

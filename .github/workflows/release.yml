name: Publish reviewed LeakScope release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed source SemVer, without v
        required: true
        type: string
      channel:
        required: true
        type: choice
        options: [prerelease, stable]
      dry_run:
        description: Build, validate and plan only; never publish
        type: boolean
        default: true
      confirmation:
        description: For publication, type PUBLISH vVERSION
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      channel: ${{ steps.validate.outputs.channel }}
      sha: ${{ steps.validate.outputs.sha }}
      publish: ${{ steps.validate.outputs.publish }}
      dry_run: ${{ steps.validate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: validate
        run: python scripts/release_request.py request
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
  authorization:
    needs: request
    if: needs.request.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require protected publication environment, separate from kernel certification
        run: python scripts/release_request.py environment
        env:
          GH_TOKEN: ${{ github.token }}
      - if: needs.request.outputs.channel == 'stable'
        uses: ./.github/actions/setup
      - name: Fetch same-commit production certification for stable only
        if: needs.request.outputs.channel == 'stable'
        run: |
          if [ -z "$EVIDENCE_RUN" ]; then
            echo "Stable publication requires current-source production certification (PRODUCTION_EVIDENCE_RUN_ID)." >&2
            .venv/bin/python scripts/release_request.py stable
            exit 1
          fi
          gh run view "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > /tmp/evidence-run.json
          python -c 'import json,os; r=json.load(open("/tmp/evidence-run.json")); assert r["headSha"]==os.environ["RELEASE_TARGET_SHA"] and r["conclusion"]=="success"'
          gh run download "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --name production-evidence --dir artifacts/production
          .venv/bin/python scripts/release_request.py stable --evidence artifacts/production/release-evidence.json
          python scripts/check-trusted-environment.py kernel-validation
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ vars.PRODUCTION_EVIDENCE_RUN_ID }}
          RELEASE_TARGET_SHA: ${{ needs.request.outputs.sha }}
      - if: needs.request.outputs.channel == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-receipts
          path: artifacts/production/release-evidence.json
          if-no-files-found: error
  abi:
    needs: request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unicode: [ucs2, ucs4]
        mode: [release, debug, lab]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
      - run: bash scripts/build-python27.sh "$UNICODE" "$MODE"
        env:
          UNICODE: ${{ matrix.unicode }}
          MODE: ${{ matrix.mode }}
  kernel:
    needs: [request, authorization]
    if: needs.request.outputs.channel == 'stable' && needs.request.outputs.publish == 'true'
    runs-on: [self-hosted, linux, x64, leakscope-kernel]
    environment: kernel-validation
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
      - uses: ./.github/actions/setup
      - run: bash scripts/build-python27.sh ucs4 release
      - run: bash scripts/test-kernel.sh
        env:
          LEAKSCOPE_SENSOR_CAPABILITIES: ${{ vars.LEAKSCOPE_SENSOR_CAPABILITIES }}
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - run: corepack pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: bash scripts/test-kernel-browser.sh
        env:
          LEAKSCOPE_SENSOR_BIN: ${{ github.workspace }}/target/release/leakscope-sensor
          LEAKSCOPE_ANALYZER_BIN: ${{ github.workspace }}/target/release/leakscope-analyzer
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-kernel-evidence
          path: artifacts/kernel
  build:
    needs: [request, authorization, abi, kernel]
    if: >-
      always() && needs.request.result == 'success' && needs.abi.result == 'success' &&
      (needs.authorization.result == 'success' || needs.authorization.result == 'skipped') &&
      (needs.kernel.result == 'success' || needs.kernel.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Restore stable evidence without replacing certification rules
        if: needs.request.outputs.channel == 'stable' && needs.request.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-receipts
          path: artifacts
      - run: bash scripts/build-python27.sh ucs4 release
      - run: bash scripts/build-python27.sh ucs4 lab
      - run: make lint typecheck test contracts
      - run: git diff --exit-code -- schemas/openapi/v1.json packages/api-client/schema.d.ts
      - run: corepack pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: make test-e2e
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - run: .venv/bin/pip-audit --skip-editable
      - run: corepack pnpm audit --prod
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - id: recover
        name: Recover exact original bundle from an existing GitHub draft
        run: |
          .venv/bin/python scripts/release.py recover > /tmp/recovery.json
          .venv/bin/python -c 'import json,os; r=json.load(open("/tmp/recovery.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("recovered="+str(r["recovered"]).lower()+"\n")'
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.recover.outputs.recovered != 'true'
        run: .venv/bin/python scripts/release.py build
      - run: .venv/bin/python scripts/release.py verify
      - name: Public read-only publication plan; no registry secrets are available
        run: .venv/bin/python scripts/release_publish.py plan > artifacts/publication-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: release-build-failure
          path: |
            artifacts/deployment/*.log
            apps/web/test-results
            apps/web/playwright-report
  attest:
    needs: [request, build]
    if: needs.request.outputs.publish == 'true' && vars.RELEASE_ATTESTATIONS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: artifacts/release/*
  draft:
    needs: [request, build, attest]
    if: >-
      always() && needs.request.outputs.publish == 'true' && needs.build.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release
      - name: Publish and verify draft
        run: python scripts/release_publish.py draft
        env:
          PYTHONPATH: apps/api
          RELEASE_PUBLICATION_AUTHORIZED: "yes"
          RELEASE_TARGET_SHA: ${{ needs.request.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-draft
          path: artifacts/publication-draft.json
  crates:
    needs: [request, draft]
    if: always() && needs.request.outputs.publish == 'true' && needs.draft.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release
      - name: Publish and verify crates
        run: python scripts/release_publish.py crates
        env:
          PYTHONPATH: apps/api
          RELEASE_PUBLICATION_AUTHORIZED: "yes"
          RELEASE_TARGET_SHA: ${{ needs.request.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CRATES_IO_OWNER: ${{ vars.CRATES_IO_OWNER || 'polsala' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-crates
          path: artifacts/publication-crates.json
  pypi:
    needs: [request, crates]
    if: always() && needs.request.outputs.publish == 'true' && needs.crates.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release
      - name: Install hash-locked publishing tools before exposing PYPI_TOKEN
        run: python -m pip install --require-hashes -r artifacts/release/requirements-publish.txt
      - name: Publish and verify pypi
        run: python scripts/release_publish.py pypi
        env:
          PYTHONPATH: apps/api
          RELEASE_PUBLICATION_AUTHORIZED: "yes"
          RELEASE_TARGET_SHA: ${{ needs.request.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-pypi
          path: artifacts/publication-pypi.json
  ghcr:
    needs: [request, pypi]
    if: always() && needs.request.outputs.publish == 'true' && needs.pypi.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release
      - name: Publish and verify ghcr
        run: python scripts/release_publish.py ghcr
        env:
          PYTHONPATH: apps/api
          RELEASE_PUBLICATION_AUTHORIZED: "yes"
          RELEASE_TARGET_SHA: ${{ needs.request.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-ghcr
          path: artifacts/publication-ghcr.json
  finalize:
    concurrency:
      group: leakscope-release-finalization
      cancel-in-progress: false
    needs: [request, crates, pypi, ghcr]
    if: always() && needs.request.outputs.publish == 'true' && needs.crates.result == 'success' && needs.pypi.result == 'success' && needs.ghcr.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-release-${{ needs.request.outputs.version }}
          path: artifacts/release
      - name: Publish and verify finalize
        run: python scripts/release_publish.py finalize
        env:
          PYTHONPATH: apps/api
          RELEASE_PUBLICATION_AUTHORIZED: "yes"
          RELEASE_TARGET_SHA: ${{ needs.request.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-finalize
          path: artifacts/publication-finalize.json
      - name: Release summary
        run: cat artifacts/publication-finalize.json >> "$GITHUB_STEP_SUMMARY"

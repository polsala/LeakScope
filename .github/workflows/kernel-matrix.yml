name: Isolated kernel validation
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    env:
      LEAKSCOPE_SENSOR_CAPABILITIES: ${{ vars.LEAKSCOPE_SENSOR_CAPABILITIES }}
    # Never run untrusted PR code on a host with tracing capabilities.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, leakscope-kernel]
    environment: kernel-validation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup
      - run: bash scripts/build-python27.sh ucs4 release
      - run: make test-native
      - name: Real attachment, independent counters and durable native captures
        run: bash scripts/test-kernel.sh
        env:
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - run: corepack pnpm build
      - run: corepack pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Native browser journey
        run: bash scripts/test-kernel-browser.sh
        env:
          LEAKSCOPE_SENSOR_BIN: ${{ github.workspace }}/target/release/leakscope-sensor
          LEAKSCOPE_ANALYZER_BIN: ${{ github.workspace }}/target/release/leakscope-analyzer
          PYTHON27: ${{ github.workspace }}/.cache/python27/install-ucs4-release/bin/python2.7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-evidence
          path: |
            artifacts/kernel
            artifacts/kernel-browser.log
            apps/web/test-results

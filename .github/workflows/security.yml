name: Dependency and source security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 2'
permissions:
  contents: read
jobs:
  audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: mkdir -p artifacts
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: .venv/bin/pip-audit --skip-editable
      - run: corepack pnpm audit --prod
      - run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect --source . --log-opts=--all --redact
      - run: .venv/bin/python scripts/sbom.py
      - run: corepack pnpm licenses list --prod --json > artifacts/licenses.json
      - run: .venv/bin/pytest -q tests/security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-inventory
          path: artifacts/*.json
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.8.3
      - run: bandit -r apps/api/leakscope_api -lll -iii

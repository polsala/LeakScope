name: Pinned LeakScope build environment
description: Install supported modern runtimes, exact toolchain, and locked dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24.13.0'
    - shell: bash
      run: |
        if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
        corepack enable
        rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
        bash scripts/setup.sh
      env:
        PYTHON: python
        UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
